[project]
name = "providence-evidence"
version = "0.2.0"
description = "Deprecated: now part of receipt-evidence. Installs it and keeps old imports working."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["evidence", "verification", "provenance", "schema", "testing"]
classifiers = [
    "Development Status :: 7 - Inactive",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Quality Assurance",
]
# Stdlib only -- hashlib and json are all a hash-and-manifest checker needs.
dependencies = ["receipt-evidence>=0.2.0"]

urls.Source = "https://github.com/MaXiMo000/providence"

[project.scripts]
providence = "receipt_evidence.providence.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["providence*"]
